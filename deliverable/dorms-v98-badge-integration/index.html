<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도름이 V98 · 함께 입고 움직이기</title><link rel="stylesheet" href="/styles.css"><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head><body>
<header><small>도름이 / V60 / V98 실행기 연결</small><h1>함께 입고, 움직이기</h1><p>승인 표정 34종 · 승인 행동 21종 · 소품 17종 · 배지 20종 · 나선 원색 8종 / 자유 색상</p></header>
<main><section class="stage"><canvas id="scene"></canvas><div class="views"><button data-view="front">정면</button><button data-view="quarter">45도</button><button data-view="side">측면</button><button data-view="back">뒷면</button><label>확대 <input id="zoom" type="range" min="65" max="180" value="100"></label></div></section>
<aside><p id="notice" role="status">승인 자산을 확인하고 있어요…</p><label>표정 <select id="expression"></select></label><label>행동 <select id="action"></select></label><label class="toggle"><input type="checkbox" id="candidates"> 후보 소품·배지 시험</label><label>머리 · 모자와 핀 <select id="head"><option value="">착용하지 않음</option></select></label><label>손 · 도구 <select id="hand"><option value="">들지 않음</option></select></label><label>가슴 배지 · V97 후보 <select id="badge"><option value="">착용하지 않음</option></select></label><label>배치 · 컴퓨터 / 책 / 나머지 소품 <select id="scene-prop"><option value="">배치하지 않음</option></select></label><label>소품·행동 조합 <select id="combo"></select></label><button id="apply-combo">선택한 조합 적용 · 후보</button><p class="hint">소품과 배지는 부착 검수 후보입니다. 얼굴·나선 가림과 손 접촉을 확인해 주세요.</p><label>계절 <select id="season"><option value="none">없음</option><option value="spring">봄</option><option value="summer">여름</option><option value="autumn">가을</option><option value="winter">겨울</option></select></label><label>나선 색상 · 흰 몸 유지 <select id="effect"><option value="red">원색 빨강</option><option value="orange">원색 주황</option><option value="yellow">원색 노랑</option><option value="emerald">원색 초록</option><option value="blue">원색 파랑</option><option value="indigo">원색 남색</option><option value="violet">원색 보라</option><option value="black">검정</option><option value="custom">직접 선택</option><option value="navy">기본 남색</option><option value="purple">생각의 보라</option><option value="pink">다정한 분홍</option><option value="gold">응원의 금빛</option><option value="green">차분한 초록</option><option value="cyan">하늘색</option></select></label><label>나선 자유 색상 <input type="color" id="custom-color" value="#ff0000"></label><div class="buttons"><button id="play">재생</button><button id="reset">초기화</button><button id="capture">사진 저장</button><button id="record">5초 녹화</button></div><label>진행 <input id="timeline" type="range" min="0" max="100" value="0"></label><div class="buttons"><button id="winter-preset">겨울 인사</button><button id="wand-preset">요술봉 응원</button><button id="megaphone-preset">확성기로 말하기 · 후보</button><button id="bag-preset">주머니 들기 · 후보</button></div><details><summary>원본 경로·승인 상태</summary><pre id="identity"></pre></details></aside></main>
<section class="review"><h2>현재 조합 검수</h2><div class="buttons"><button data-decision="pass">통과</button><button data-decision="fix">수정 필요</button><button data-decision="hold">보류</button><button id="export">판정 JSON 내보내기</button></div><textarea id="notes" placeholder="접촉·가림·움직임 검수 메모"></textarea><p id="decision">판정 전</p></section><footer>원본 보존 · V60 정적 표정 승인 34종 · 소품 후보 · 립싱크/연속 표정 보간 없음 · 전체 출시 완료 아님</footer><button id="desktop-close" hidden>도름이 종료</button><script type="module" src="/src/app.mjs"></script></body></html>
